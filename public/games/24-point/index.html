<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#123c32" />
    <title>24点 · 扑克牌挑战</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">24</span>
          <div>
            <h1>24点挑战</h1>
            <p>点击数字和运算符，一步一步算出 24</p>
          </div>
        </div>
        <button class="icon-button" id="soundButton" type="button" aria-label="开关音效" title="开关音效">♪</button>
      </header>

      <section class="scoreboard" aria-label="游戏数据">
        <div><span>得分</span><strong id="score">0</strong></div>
        <div><span>连胜</span><strong id="streak">0</strong></div>
        <div><span>用时</span><strong id="timer">00:00</strong></div>
      </section>

      <section class="table" aria-label="牌桌">
        <div class="table-copy">
          <span class="round-label" id="roundLabel">第 1 题</span>
          <h2>让结果等于 <em>24</em></h2>
          <p>先点数字，再点运算符，最后点另一个数字</p>
        </div>

        <div class="cards" id="cards" aria-label="本题扑克牌"></div>

        <div class="expression-panel">
          <span class="expression-label">本步运算</span>
          <div class="expression" id="expression" aria-live="polite">
            <span class="placeholder">请先点击一个数字</span>
          </div>
          <div class="result-preview" id="resultPreview">结果：—</div>
        </div>

        <div class="keypad" aria-label="运算按钮">
          <button data-token="+" type="button">＋</button>
          <button data-token="-" type="button">−</button>
          <button data-token="*" type="button">×</button>
          <button data-token="/" type="button">÷</button>
          <button class="utility" id="undoButton" type="button">撤销</button>
          <button class="utility" id="clearButton" type="button">重置本题</button>
        </div>

        <div class="feedback" id="feedback" aria-live="assertive"></div>

        <div class="primary-actions">
          <button class="secondary-button" id="hintButton" type="button">给我提示</button>
          <button class="secondary-button" id="newGameButton" type="button">换一题</button>
        </div>
      </section>

      <footer>牌面范围 A～10 · A 代表 1</footer>
    </main>

    <div class="celebration" id="celebration" aria-hidden="true"></div>
    <script src="game.js"></script>
  </body>
</html>
